<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alerte Collègue</title>
<link rel="manifest" href="/manifest.json">
<style>
  body {
    font-family: -apple-system, Roboto, Arial, sans-serif;
    background: #111;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
  }
  h1 { font-size: 1.4em; text-align: center; }
  button {
    font-size: 1.2em;
    padding: 18px 30px;
    margin: 12px 0;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    width: 100%;
    max-width: 340px;
  }
  #subscribeBtn { background: #2563eb; color: white; }
  #alertBtn {
    background: #dc2626;
    color: white;
    font-weight: bold;
    font-size: 1.5em;
    padding: 30px;
  }
  #status { margin-top: 20px; text-align: center; min-height: 24px; }
  input {
    font-size: 1em;
    padding: 10px;
    width: 100%;
    max-width: 320px;
    margin-bottom: 10px;
    border-radius: 8px;
    border: 1px solid #444;
    box-sizing: border-box;
  }
</style>
</head>
<body>
  <h1>Système d'alerte</h1>

  <button id="subscribeBtn">🔔 Activer les alertes sur ce téléphone</button>

  <hr style="width:100%; max-width:340px; border-color:#333; margin: 20px 0;">

  <input id="messageInput" type="text" placeholder="Message (optionnel)" />
  <button id="alertBtn">🚨 DÉCLENCHER L'ALERTE</button>

  <div id="status"></div>

  <script src="/app.js"></script>
</body>
</html>
